# Production nginx (the `web` image): serves public/ and proxies /api/ to the `api` service.
pid /tmp/nginx.pid;
error_log /dev/stderr;
events {}
http {
  access_log /dev/stdout;
  client_body_temp_path /tmp/body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  include /etc/nginx/mime.types;
  types { audio/wav wav; audio/flac flac; audio/aac aac; }
  server_tokens off;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;
    add_header X-Content-Type-Options nosniff always;

    location / { try_files $uri $uri/ =404; }
    location ~* \.(css|js|png|wav|flac|aac)$ {
      expires 1h;
      add_header X-Content-Type-Options nosniff always;
    }

    location /api/ {
      # Variable + resolver: nginx re-resolves `api` instead of caching its IP at startup.
      resolver 127.0.0.11 valid=10s;
      set $api http://api:5000;
      proxy_pass $api;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
