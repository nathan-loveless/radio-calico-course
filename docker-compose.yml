# prod (db + api + web):  cp .env.example .env  # fill in the secrets, then:
#                         docker compose up -d --build        -> http://localhost:8080
# dev (SQLite, one container, live source, no secrets needed): see docker-compose.dev.yml
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: radiocalico
      POSTGRES_USER: radiocalico
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radiocalico -d radiocalico"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  api:
    build: { context: ., target: api }
    image: radiocalico-api
    environment:
      DATABASE_URL: postgresql://radiocalico:${POSTGRES_PASSWORD}@db:5432/radiocalico
      RADIOCALICO_SECRET_KEY: ${RADIOCALICO_SECRET_KEY:?set RADIOCALICO_SECRET_KEY in .env}
    depends_on:
      db: { condition: service_healthy }
    restart: unless-stopped        # not published; only `web` can reach it

  web:
    build: { context: ., target: web }
    image: radiocalico-web
    ports: ["8080:8080"]
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

volumes:
  pgdata:
