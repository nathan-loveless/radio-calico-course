pid /home/nathansl2003/radiocalico/run/nginx.pid;
error_log /home/nathansl2003/radiocalico/logs/error.log;
daemon on;
events {}
http {
  access_log /home/nathansl2003/radiocalico/logs/access.log;
  client_body_temp_path /home/nathansl2003/radiocalico/run/body;
  proxy_temp_path /home/nathansl2003/radiocalico/run/proxy;
  fastcgi_temp_path /home/nathansl2003/radiocalico/run/fcgi;
  uwsgi_temp_path /home/nathansl2003/radiocalico/run/uwsgi;
  scgi_temp_path /home/nathansl2003/radiocalico/run/scgi;
  include /etc/nginx/mime.types;
  types { audio/wav wav; audio/flac flac; audio/aac aac; }
  server {
    listen 127.0.0.1:8080;
    root /home/nathansl2003/radiocalico/public;
    index index.html;
    location / { try_files $uri $uri/ =404; }
    location /api/ { proxy_pass http://127.0.0.1:5000; }
  }
}
